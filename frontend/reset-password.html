<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camagru - Reset Password</title>
</head>
<body>
    <main>
        <h1>Reset Password</h1>
        <div id="status-message" style="font-weight: bold; margin-bottom: 15px;"></div>
        <form id="reset-password-form">
            <div>
                <label>New password:</label>
                <input type="password" id="reset-password" required minlength="8">
            </div>
            <button type="submit">Reset Password</button>
        </form>
        <p><a href="/index.html">Back to login</a></p>
    </main>
    <script type="module" src="js/resetPassword.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camagru Auth</title>
</head>
<body>
    <main>
        <h1>Camagru</h1>
        <div id="status-message" style="font-weight: bold; margin-bottom: 15px;"></div>
        <section id="login-section">
            <h2>Login</h2>
            <form id="login-form">
                <div>
                    <label>Email:</label>
                    <input type="email" id="login-email" required>
                </div>
                <div>
                    <label>Password:</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit">Sign In</button>
            </form>
            <p>Don't have an account? <button id="show-register">Register here</button></p>
            <p><a href="forgot-password.html">Forgot password?</a></p>
        </section>
        <section id="register-section" style="display: none;">
            <h2>Register</h2>
            <form id="register-form">
                <div>
                    <label>Username:</label>
                    <input type="text" id="register-username" required>
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" id="register-email" required>
                </div>
                <div>
                    <label>Password:</label>
                    <input type="password" id="register-password" required minlength="8">
                </div>
                <button type="submit">Create Account</button>
            </form>
            <p>Already have an account? <button id="show-login">Login here</button></p>
        </section>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>

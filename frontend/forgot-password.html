<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camagru - Forgot Password</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main>
        <header class="site-header">
            <div class="site-header-top">
                <div>
                    <span class="logo">camagru</span>
                    <span class="tagline">take a picture, put something on it</span>
                </div>
            </div>
        </header>

        <div id="status-message" class="status-message"></div>

        <div class="page-content stack">
            <div class="card narrow-card">
                <div class="card-header">Reset by email</div>
                <div class="card-body">
                    <p class="hint">Enter the address you registered with. We send a single-use link that expires in 30 minutes.</p>
                    <form id="forgot-password-form" class="stack">
                        <label class="field">
                            <span>Email</span>
                            <input type="email" id="forgot-email" required>
                        </label>
                        <button type="submit" class="btn-plain">Send link</button>
                    </form>
                </div>
            </div>
            <p class="hint"><a href="/index.html">Back to login</a></p>
        </div>

        <footer class="site-footer">
            <span>camagru &mdash; built by <a href="https://github.com/grysha11" target="_blank" rel="noopener">@grysha11</a></span>
        </footer>
    </main>
    <script type="module" src="js/forgotPassword.js"></script>
</body>
</html>

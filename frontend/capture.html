<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camagru - Take a Picture</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main>
        <header class="site-header">
            <div class="site-header-top">
                <div>
                    <a href="/gallery.html" class="logo">camagru</a>
                    <span class="tagline">take a picture, put something on it</span>
                </div>
                <div class="header-auth">
                    <span id="nav-user" class="hidden"></span>
                    <a id="nav-logout" href="#" class="hidden">log out</a>
                    <a id="nav-login-link" href="/index.html">Log in</a>
                    <a id="nav-register-link" href="/index.html">Register</a>
                </div>
            </div>
            <nav id="site-nav" class="site-nav hidden">
                <a href="/gallery.html" class="nav-link" data-nav="wall">the wall</a>
                <a href="/capture.html" class="nav-link" data-nav="capture">take a picture</a>
                <a href="/profile.html" class="nav-link" data-nav="profile">my page</a>
                <a href="/settings.html" class="nav-link" data-nav="settings">settings</a>
            </nav>
        </header>

        <div id="status-message" class="status-message"></div>

        <div class="page-content">
            <div class="capture-columns">
                <div class="capture-main stack">
                    <div class="card">
                        <div class="card-header">Camera</div>
                        <div class="card-body">
                            <div class="camera-wrap" id="camera-wrap">
                                <video id="camera-preview" autoplay playsinline muted></video>
                                <img id="overlay-preview" class="overlay-preview hidden" alt="">
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">Overlays</div>
                        <div class="card-body">
                            <div id="overlay-list" class="overlay-grid"></div>
                            <div class="capture-controls">
                                <button id="capture-btn" class="btn-primary" disabled>Take the picture</button>
                                <label for="file-fallback" class="hint">Or upload a photo:</label>
                                <input type="file" id="file-fallback" accept="image/*" disabled>
                            </div>
                            <p class="hint">The button is disabled until an overlay is selected.</p>
                        </div>
                    </div>

                    <canvas id="capture-canvas" class="hidden"></canvas>
                </div>

                <div class="capture-sidebar">
                    <h2>Your posts</h2>
                    <div id="my-posts" class="my-posts-grid"></div>
                </div>
            </div>
        </div>

        <footer class="site-footer">
            <span>camagru &mdash; built by <a href="https://github.com/grysha11" target="_blank" rel="noopener">@grysha11</a></span>
        </footer>
    </main>
    <script type="module" src="/js/capture.js"></script>
</body>
</html>

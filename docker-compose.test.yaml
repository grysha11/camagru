name: camagru-test

services:
  db-test:
    image: postgres:15-alpine
    container_name: camagru-db-test
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: camagru_test
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  pgdata-test:

openapi: 3.0.0
info:
  title: Camagru API
  version: 1.0.0

paths:
  /healthz:
    get:
      summary: Health check endpoint
      operationId: GetHealthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: "ok"

  /api/register:
    post:
      summary: Register a new user
      operationId: RegisterUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully. Awaiting email confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request (e.g., duplicate email, weak password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/login:
    post:
      summary: Log in a user
      operationId: LoginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully logged in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "Sends the HttpOnly access_token and refresh_token"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/refresh:
    post:
      summary: Refresh the access token
      operationId: RefreshToken
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "Sends the new access_token and refresh_token"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid, missing, or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      summary: Get the current authenticated user
      operationId: GetMe
      responses:
        '200':
          description: Authenticated user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/logout:
    post:
      summary: Log out a user
      operationId: LogoutUser
      responses:
        '200':
          description: Successfully logged out
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "Clears the auth cookies"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/confirm-email:
    get:
      summary: Confirm a user's email address
      operationId: ConfirmEmail
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email confirmed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/forgot-password:
    post:
      summary: Request a password reset email
      operationId: ForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: A reset email was sent if an account with that email exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/request-password-change:
    post:
      summary: Generate a password reset token for the current authenticated user (no email sent)
      operationId: RequestPasswordChange
      responses:
        '200':
          description: Token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeTokenResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reset-password:
    post:
      summary: Reset a user's password using a token
      operationId: ResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid/expired token or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/oauth/github/login:
    get:
      summary: Start GitHub OAuth2 login
      operationId: GitHubOAuthLogin
      responses:
        '302':
          description: Redirect to GitHub's authorize screen
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: "Sets the short-lived oauth_state cookie"
        '500':
          description: Could not start the OAuth flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/oauth/github/callback:
    get:
      summary: Handle the GitHub OAuth2 callback
      operationId: GitHubOAuthCallback
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect back to the frontend (success -> gallery, failure -> index with oauth_error)
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: "Clears oauth_state; on success also sets access_token/refresh_token"

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: "grisha"
        email:
          type: string
          format: email
          example: "example@example.com"
        password:
          type: string
          format: password
          example: "SuperSecret1!"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "example@example.com"
        password:
          type: string
          format: password
          example: "SuperSecret1!"

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "example@example.com"

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          format: password
          example: "SuperSecret1!"

    PasswordChangeTokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    UserResponse:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email

    SuccessResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Operation successful"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Something went wrong"
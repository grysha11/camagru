openapi: 3.0.0
info:
  title: Camagru API
  version: 1.0.0

paths:
  /healthz:
    get:
      summary: Health check endpoint
      operationId: GetHealthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: "ok"

  /api/register:
    post:
      summary: Register a new user
      operationId: RegisterUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully. Awaiting email confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request (e.g., duplicate email, weak password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/login:
    post:
      summary: Log in a user
      operationId: LoginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully logged in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "Sends the HttpOnly access_token and refresh_token"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/refresh:
    post:
      summary: Refresh the access token
      operationId: RefreshToken
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "Sends the new access_token and refresh_token"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Invalid, missing, or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      summary: Get the current authenticated user
      operationId: GetMe
      responses:
        '200':
          description: Authenticated user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update the current user's username, email, or comment-notification preference
      operationId: UpdateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated (email change, if any, is pending confirmation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
        '400':
          description: Invalid username/email or nothing to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username or email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Permanently delete the current user's account
      operationId: DeleteAccount
      responses:
        '200':
          description: Account deleted
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "Clears the auth cookies"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/avatar:
    post:
      summary: Upload/replace the current user's avatar image
      operationId: UploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad request (invalid image or too large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not save avatar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/logout:
    post:
      summary: Log out a user
      operationId: LogoutUser
      responses:
        '200':
          description: Successfully logged out
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "Clears the auth cookies"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/confirm-email:
    get:
      summary: Confirm a user's email address
      operationId: ConfirmEmail
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email confirmed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/confirm-email-change:
    get:
      summary: Confirm a pending email address change
      operationId: ConfirmEmailChange
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email address changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/forgot-password:
    post:
      summary: Request a password reset email
      operationId: ForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: A reset email was sent if an account with that email exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/request-password-change:
    post:
      summary: Email the current authenticated user a password reset link
      operationId: RequestPasswordChange
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reset-password:
    post:
      summary: Reset a user's password using a token
      operationId: ResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid/expired token or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/oauth/github/login:
    get:
      summary: Start GitHub OAuth2 login
      operationId: GitHubOAuthLogin
      responses:
        '302':
          description: Redirect to GitHub's authorize screen
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: "Sets the short-lived oauth_state cookie"
        '500':
          description: Could not start the OAuth flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/oauth/github/link:
    get:
      summary: Start linking the authenticated user's account to GitHub OAuth2
      operationId: GitHubOAuthLink
      responses:
        '302':
          description: Redirect to GitHub's authorize screen
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: "Sets the short-lived oauth_state and oauth_intent cookies"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not start the OAuth flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/oauth/github/callback:
    get:
      summary: Handle the GitHub OAuth2 callback
      operationId: GitHubOAuthCallback
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect back to the frontend (login flow success -> gallery, link flow success -> settings, failure -> the initiating page with oauth_error)
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: "Clears oauth_state/oauth_intent; on a login-flow success also sets access_token/refresh_token"

  /api/oauth/github/unlink:
    delete:
      summary: Unlink the authenticated user's GitHub account
      operationId: GitHubOAuthUnlink
      responses:
        '200':
          description: GitHub account unlinked (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: No password set — linking would leave the account with no way to log in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not unlink GitHub account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{username}:
    get:
      summary: Get a user's public profile
      operationId: GetUserProfile
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The user's public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{username}/posts:
    get:
      summary: List a user's posts (public)
      operationId: ListUserPosts
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The user's posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostSummary'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not load posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/overlays:
    get:
      summary: List available overlay PNGs
      operationId: ListOverlays
      responses:
        '200':
          description: Available overlays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OverlayResponse'

  /api/posts/mine:
    get:
      summary: List the authenticated user's own posts
      operationId: ListMyPosts
      responses:
        '200':
          description: The user's posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostSummary'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not load posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/posts:
    get:
      summary: List public posts, paginated
      operationId: ListPosts
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: A page of public posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '500':
          description: Could not load posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Capture/upload a photo composited with an overlay
      operationId: CreatePost
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
                - overlay_id
              properties:
                image:
                  type: string
                  format: binary
                overlay_id:
                  type: string
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Bad request (invalid image, unknown overlay, too large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not save post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/posts/{id}:
    get:
      summary: Get a single post
      operationId: GetPost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostSummary'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not load post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a post (owner only)
      operationId: DeletePost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the owner of this post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not delete post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/posts/{id}/like:
    post:
      summary: Like a post
      operationId: LikePost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post liked (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Unlike a post
      operationId: UnlikePost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post unliked (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/posts/{id}/comments:
    get:
      summary: List comments on a post
      operationId: ListComments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The post's comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Comment on a post
      operationId: CreateComment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          description: Empty or too-long comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/posts/{id}/comments/{commentId}:
    delete:
      summary: Delete a comment (owner only)
      operationId: DeleteComment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the owner of this comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not delete comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: "grisha"
        email:
          type: string
          format: email
          example: "example@example.com"
        password:
          type: string
          format: password
          example: "SuperSecret1!"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "exampleuser"
        password:
          type: string
          format: password
          example: "SuperSecret1!"

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "example@example.com"

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          format: password
          example: "SuperSecret1!"

    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - notify_on_comment
        - created_at
        - has_github_login
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        avatar_path:
          type: string
          nullable: true
        notify_on_comment:
          type: boolean
        created_at:
          type: string
          format: date-time
        has_github_login:
          type: boolean

    PublicUserResponse:
      type: object
      required:
        - username
        - created_at
      properties:
        username:
          type: string
        avatar_path:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        username:
          type: string
          example: "grisha"
        email:
          type: string
          format: email
          example: "example@example.com"
        notify_on_comment:
          type: boolean

    UpdateProfileResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        message:
          type: string
          nullable: true

    OverlayResponse:
      type: object
      required:
        - id
        - url
      properties:
        id:
          type: string
        url:
          type: string

    PostResponse:
      type: object
      required:
        - id
        - image_path
        - created_at
      properties:
        id:
          type: string
          format: uuid
        image_path:
          type: string
        overlay_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    PostSummary:
      type: object
      required:
        - id
        - user_id
        - username
        - image_path
        - created_at
        - like_count
        - comment_count
        - liked_by_me
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
        image_path:
          type: string
        overlay_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        like_count:
          type: integer
        comment_count:
          type: integer
        liked_by_me:
          type: boolean

    PostListResponse:
      type: object
      required:
        - posts
        - page
        - page_size
        - total_posts
        - total_pages
        - has_next
        - has_prev
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
        page:
          type: integer
        page_size:
          type: integer
        total_posts:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean

    CommentResponse:
      type: object
      required:
        - id
        - post_id
        - user_id
        - username
        - content
        - created_at
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time

    CreateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: "Nice shot!"

    SuccessResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Operation successful"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Something went wrong"